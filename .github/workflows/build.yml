name: 🧪 Run Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      run_vulkan_hardware:
        description: Run the optional Vulkan probe on a labeled self-hosted runner
        required: true
        default: false
        type: boolean

jobs:
  path-hygiene:
    name: "🔒 Path hygiene"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🔒 Reject machine-specific paths and SDK assignments
        shell: bash
        run: |
          patterns=(
            '(^|[[:space:]`"=])[A-Za-z]:[\\/]'
            '(^|[[:space:]`"=])/User''s/'
            '(^|[[:space:]`"=])/home/'
            '(^|[[:space:]`"=])/mnt/'
            '(^|[[:space:]`"=])/workspace/'
          )
          sdk_name='VULKAN_SDK'
          patterns+=("${sdk_name}[[:space:]]*=[^`\"[:space:]]")
          for pattern in "${patterns[@]}"; do
            if git grep -n -E "$pattern" -- .github/workflows/build.yml docs/design/vulkan-compute-acceleration-development-report.md >/dev/null; then
              echo "::error::Path hygiene violation in the controlled CI/docs files."
              exit 1
            fi
          done

  test:
    strategy:
      fail-fast: false

      matrix:
        config:
          - Release
          - Debug

        os:
          - macos-15-intel
          - macos-latest

        include:
          - os: ubuntu-latest
            config: Release
            container: ghcr.io/viennatools/vienna-builder:suite
          - os: ubuntu-latest
            config: Debug
            container: ghcr.io/viennatools/vienna-builder:suite
          - os: windows-latest
            config: Release+Debug

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    env:
      VCPKG_COMMIT: 72d876b20f06129a1b1e0db80c7075fe3e419d7c
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache

    name: "🧪 Test on ${{ matrix.os }} (⚙️: ${{ matrix.config }}, 💿: ${{ matrix.container || matrix.os }})"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🖥️ Setup Environment
        uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os }}

      - name: 🔗 Prepare ViennaLS source
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          VIENNALS_TAG=$(awk '/NAME ViennaLS/{f=1} f && /GIT_TAG/{print $2; exit}' CMakeLists.txt)
          if ! git ls-remote --tags --exit-code https://github.com/ViennaTools/ViennaLS.git "$VIENNALS_TAG" > /dev/null 2>&1; then
            echo "[CI] Tag $VIENNALS_TAG not found; cloning master as fallback"
            rm -rf _viennals
            git clone --depth 1 --branch master https://github.com/ViennaTools/ViennaLS.git _viennals
            echo "CPM_ViennaLS_SOURCE=$(pwd)/_viennals" >> "$GITHUB_ENV"
          fi

      - name: 🔗 Prepare ViennaLS source (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          $viennalsTag = [regex]::Match($content, 'NAME\s+ViennaLS.*?GIT_TAG\s+(\S+)', [System.Text.RegularExpressions.RegexOptions]::Singleline).Groups[1].Value
          git ls-remote --tags --exit-code https://github.com/ViennaTools/ViennaLS.git $viennalsTag | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[CI] Tag $viennalsTag not found; cloning master as fallback"
            Remove-Item -Recurse -Force _viennals -ErrorAction SilentlyContinue
            git clone --depth 1 --branch master https://github.com/ViennaTools/ViennaLS.git _viennals
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # Forward slashes: CMake treats a backslash as an escape, so raw
            # Windows paths must be normalized before forwarding.
            $viennalsSource = (Get-Location).Path.Replace('\', '/')
            "CPM_ViennaLS_SOURCE=$viennalsSource/_viennals" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: 🖥️ Setup vcpkg (Windows)
        shell: pwsh
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue

          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout $env:VCPKG_COMMIT
          & .\vcpkg\bootstrap-vcpkg.bat

          "VCPKG_ROOT=$($env:GITHUB_WORKSPACE)\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

      - name: 📋 Install MacOS Dependencies
        if: ${{ startsWith(matrix.os, 'macos-') }}
        run: brew install vtk embree tbb

      - name: 🔑 Prepare vcpkg cache key (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $cacheKey = [ordered]@{
            dependencies = $manifest.dependencies
            features = $manifest.features
            defaultFeatures = $manifest.'default-features'
            overrides = $manifest.overrides
            builtinBaseline = $manifest.'builtin-baseline'
          }
          $cacheKey | ConvertTo-Json -Depth 20 | Out-File -FilePath vcpkg-cache-key.json -Encoding utf8
          Get-Content vcpkg-cache-key.json

      - name: 🦥 Cache vcpkg installed (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        id: vcpkg-installed-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-installed-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg-cache-key.json') }}
          restore-keys: |
            vcpkg-installed-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-

      - name: 🛠️ Build Dependencies (Windows)
        if: ${{ matrix.os == 'windows-latest' && steps.vcpkg-installed-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          ./vcpkg/vcpkg install --triplet x64-windows

      - name: 🏗️ Compile (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $cpmArgs = @()
          if ($env:CPM_ViennaLS_SOURCE) { $cpmArgs += "-DCPM_ViennaLS_SOURCE=$env:CPM_ViennaLS_SOURCE" }
          cmake -S . -B build -DVIENNAPS_BUILD_TESTS=ON -DVIENNAPS_ENABLE_VULKAN=OFF -DVIENNAPS_BUILD_VULKAN_PROBE=OFF -DVIENNAPS_BUILD_VULKAN_SMOKE=OFF -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed -DVCPKG_MANIFEST_INSTALL=OFF @cpmArgs
          cmake --build build --config Release --parallel
          cmake --build build --config Debug --parallel

      - name: 🏗️ Compile (other)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          cmake -S . -B build -DVIENNAPS_BUILD_TESTS=ON -DVIENNAPS_ENABLE_VULKAN=OFF -DVIENNAPS_BUILD_VULKAN_PROBE=OFF -DVIENNAPS_BUILD_VULKAN_SMOKE=OFF -DVIENNAPS_ENABLE_SANITIZER=ON ${CPM_ViennaLS_SOURCE:+-DCPM_ViennaLS_SOURCE="$CPM_ViennaLS_SOURCE"}
          cmake --build build --config ${{ matrix.config }}

      - name: 🧪 Test
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          ctest --output-on-failure -E "Benchmark|Performance" -C ${{ matrix.config }} --test-dir build

      - name: 🧪 Test (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          ctest --output-on-failure -E "Benchmark|Performance" -C Release --test-dir build
          ctest --output-on-failure -E "Benchmark|Performance" -C Debug --test-dir build

  install-export:
    name: "📦 Install/export consumer (CPU, no SDK)"
    needs: path-hygiene
    runs-on: ubuntu-latest
    container: ghcr.io/viennatools/vienna-builder:suite

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🖥️ Setup Environment
        uses: ./.github/actions/setup
        with:
          os: ubuntu-latest

      - name: 🔗 Prepare ViennaLS source
        run: |
          VIENNALS_TAG=$(awk '/NAME ViennaLS/{f=1} f && /GIT_TAG/{print $2; exit}' CMakeLists.txt)
          if ! git ls-remote --tags --exit-code https://github.com/ViennaTools/ViennaLS.git "$VIENNALS_TAG" > /dev/null 2>&1; then
            echo "[CI] Tag $VIENNALS_TAG not found; cloning master as fallback"
            rm -rf _viennals
            git clone --depth 1 --branch master https://github.com/ViennaTools/ViennaLS.git _viennals
            echo "CPM_ViennaLS_SOURCE=$(pwd)/_viennals" >> "$GITHUB_ENV"
          fi

      - name: 📦 Install and consume the CPU/no-SDK package
        run: |
          cmake \
            -DVIENNAPS_INSTALL_EXPORT_WORK_DIR="$RUNNER_TEMP/viennaps-install-export" \
            ${CPM_ViennaLS_SOURCE:+-DCPM_ViennaLS_SOURCE="$CPM_ViennaLS_SOURCE"} \
            -P cmake/run-pd5-install-export.cmake

  vulkan-hardware:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vulkan_hardware == true }}
    name: "🔬 Optional Vulkan probe (self-hosted)"
    runs-on:
      - self-hosted
      - vulkan
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🏗️ Configure Vulkan probe
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "viennaps-vulkan-build"
          cmake -S . -B $buildDir `
            -DVIENNAPS_USE_VTK=OFF `
            -DVIENNAPS_VTK_RENDERING=OFF `
            -DVIENNAPS_BUILD_TESTS=ON `
            -DVIENNAPS_ENABLE_VULKAN=ON `
            -DVIENNAPS_BUILD_VULKAN_PROBE=ON `
            -DVIENNAPS_BUILD_VULKAN_SMOKE=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 🛠️ Build probe and focused deployment tests
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "viennaps-vulkan-build"
          cmake --build $buildDir --config Release --target `
            viennaps-device-probe `
            capabilityProfileIO `
            probeProfileAdapter `
            vulkanDeploymentProbe `
            vulkanDeploymentBootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 🔬 Run Vulkan probe and focused CTest
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "viennaps-vulkan-build"
          $profilePath = Join-Path $env:RUNNER_TEMP "viennaps-vulkan-deployment-profile.json"
          $probeLog = Join-Path $env:RUNNER_TEMP "viennaps-vulkan-probe.log"
          $probe = Get-ChildItem -Path $buildDir -Recurse -File |
            Where-Object { $_.Name -in @("viennaps-device-probe", "viennaps-device-probe.exe") } |
            Select-Object -First 1
          if (-not $probe) {
            Write-Error "viennaps-device-probe was not produced by the labeled self-hosted runner."
            exit 1
          }
          & $probe.FullName `
            --strict-fp32-smoke `
            --write-deployment-profile $profilePath `
            --validate-profile *> $probeLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Vulkan probe failed on the labeled self-hosted runner."
            exit $LASTEXITCODE
          }
          ctest --test-dir $buildDir -C Release --output-on-failure `
            -R "^(capabilityProfileIO|probeProfileAdapter|vulkanDeploymentProbe|vulkanDeploymentBootstrap)$"
